name = "setup-ssh"
main = "worker.js"
compatibility_date = "2026-01-01"

routes = [
  { pattern = "setup-ssh.muqimjon.uz", custom_domain = true }
]

# Kompaniya (Ovoza) - alohida tailnet, alohida secretlar
[env.ovoza]
name = "ovoza-ssh"
routes = [
  { pattern = "ovoza-ssh.muqimjon.uz", custom_domain = true }
]

# Secretlar (har muhit uchun alohida):
#   wrangler secret put TS_API_TOKEN            (shaxsiy)
#   wrangler secret put TS_API_TOKEN --env ovoza (kompaniya)
#   TS_TAILNET = '-'
