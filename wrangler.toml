# Bu fayl GENERIC. Klon qilib darhol deploy qilsa bo'ladi:
#     npx wrangler deploy
# Natija: https://setup-ssh.<sizning-akkaunt>.workers.dev
#
# Yagona kerakli narsa - Tailscale API tokeni:
#     npx wrangler secret put TS_API_TOKEN
#
# Kodda hech qanday statik ma'lumot yo'q. Skriptlar Worker ichiga bog'lanadi.

name = "setup-ssh"
main = "worker.js"
compatibility_date = "2026-01-01"

# setup.sh / setup.ps1 ni Worker ichiga matn sifatida bog'lash
rules = [
  { type = "Text", globs = ["**/*.sh", "**/*.ps1"], fallthrough = true }
]

[vars]
TS_TAILNET = "-"
KEY_TTL = "600"
# KEYS_REPO = "user/repo"   # ixtiyoriy: /keys/<nom>.pub reyestri
# KEYS_BRANCH = "main"
# DEFAULT_KEY = "nom"          # --key berilmasa shu ishlatiladi
# DEFAULT_MODE = "tailscale"   # --mode berilmasa savol o'rniga shu
# DEFAULT_USER = "nom"         # shu nomli admin/sudo hisobi ochiladi

# ============================================================
# Quyidagilar - EGASINING o'z deploylari (namuna).
# Fork qilsangiz bularni o'chiring yoki o'zingiznikiga almashtiring.
# Asosiy (env'siz) deploy ularsiz ham to'liq ishlaydi.
# ============================================================

[env.muqimjon]
name = "setup-ssh"
routes = [{ pattern = "setup-ssh.muqimjon.uz", custom_domain = true }]
[env.muqimjon.vars]
TS_TAILNET = "-"
KEY_TTL = "600"
KEYS_REPO = "muqimjon/setup-ssh"
KEYS_BRANCH = "main"
DEFAULT_KEY = "muqimjon"
DEFAULT_MODE = "all"
DEFAULT_USER = "muqimjon"

[env.ovoza]
name = "ovoza-ssh"
routes = [{ pattern = "ovoza-ssh.muqimjon.uz", custom_domain = true }]
[env.ovoza.vars]
TS_TAILNET = "-"
KEY_TTL = "600"
KEYS_REPO = "muqimjon/setup-ssh"
KEYS_BRANCH = "main"
DEFAULT_KEY = "ovoza"
DEFAULT_MODE = "tailscale"
DEFAULT_USER = "ovoza"
